rules:
  - id: "rule-init"
    description: "Start code search by querying declarative memory for known code locations."
    condition:
      symbolic:
        type: equals
        slot: "intention.current_goal.slots.status"
        value: "start"
    action:
      commands:
        retrieveMemory:
          target_module_id: "declarative_memory"
          command: "retrieve_chunk"
        updateStatus:
          target_module_id: "intention"
          command: "modify_slot"
          params:
            slot: "status"
            slot_value: "memory_queried"
      semantics:
        "command:retrieveMemory":
          sources:
            - "intention.current_goal.slots.query"
            - "declarative_memory.available_slot_keys"
          params:
            cue: >
              Construct a cue object. Choose keys from the available slot keys of declarative memory
              (if present in the buffer state) that best match the current goal query.

  - id: "rule-memory-hit"
    description: "A relevant memory was retrieved; use it to set attention tags and directly open the file if a path is known."
    condition:
      symbolic:
        type: and
        conditions:
          - type: equals
            slot: "intention.current_goal.slots.status"
            value: "memory_queried"
          - type: exist
            slot: "declarative_memory.retrieved_chunk"
    action:
      commands:
        setTags:
          target_module_id: "file_explorer"
          command: "set_attention_tags"
        openFileIfPath:
          target_module_id: "code_viewport"
          command: "open_file"
        updateStatus:
          target_module_id: "intention"
          command: "modify_slot"
          params:
            slot: "status"
            slot_value: "file_opened"
      semantics:
        "command:setTags":
          sources:
            - "declarative_memory.retrieved_chunk.slots.keywords"
          params:
            tags: "Split and normalize the retrieved keywords into lowercase tags. If the source `keywords` is missing, set an empty list"
        "command:openFileIfPath":
          sources:
            - "declarative_memory.retrieved_chunk.slots.file_path"
          params:
            file_path: "Use the retrieved file path when one is available."
        "meta:skip_if_missing":
          command: "openFileIfPath"
          instruction: "ONLY apply this skip rule to the command `openFileIfPath`. If the source `file_path` is missing or None, you MUST NOT generate any operation for this command"

  - id: "rule-memory-miss"
    description: "No memory found; push a subgoal to explore the file system for the relevant code."
    condition:
      symbolic:
        type: and
        conditions:
          - type: equals
            slot: "intention.current_goal.slots.status"
            value: "memory_queried"
          - type: not
            condition:
              type: exist
              slot: "declarative_memory.retrieved_chunk"
    action:
      commands:
        pushSubgoal:
          target_module_id: "intention"
          command: "push_subgoal"
          params:
            id: "ExploreFileSystem"
            slots:
              parent_goal_id: "${intention.current_goal.slots.id}"
              query: "${intention.current_goal.slots.query}"
              status: "exploring"

